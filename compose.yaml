services:
  bot:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    # Bind only to loopback for local diagnostics. External traffic should
    # reach the bot through Cloudflare Tunnel, not through the LAN/router.
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ckuni}
      POSTGRES_USER: ${POSTGRES_USER:-ckuni}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ckuni} -d ${POSTGRES_DB:-ckuni}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional profile for the public Discord/Strava ingress. The tunnel is
  # outbound-only from the home server and talks to the bot over Docker's
  # private network. Start with: docker compose --profile tunnel up -d --build
  cloudflared:
    image: cloudflare/cloudflared:2026.7.2
    restart: unless-stopped
    profiles: ["tunnel"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    command: tunnel --no-autoupdate run
    depends_on:
      bot:
        condition: service_healthy

volumes:
  postgres_data:
