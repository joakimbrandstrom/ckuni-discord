services:
  bot:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    # Bind only to loopback for local diagnostics. External traffic should
    # reach the bot through Cloudflare Tunnel, not through the LAN/router.
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ckuni}
      POSTGRES_USER: ${POSTGRES_USER:-ckuni}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ckuni} -d ${POSTGRES_DB:-ckuni}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Recommended permanent ingress. Create a remotely-managed Cloudflare
  # Tunnel, add a published hostname that targets http://bot:3000, and put
  # the tunnel token in CLOUDFLARE_TUNNEL_TOKEN.
  cloudflared:
    image: cloudflare/cloudflared:2026.7.2
    restart: unless-stopped
    profiles: ["tunnel"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    command: tunnel --no-autoupdate run
    depends_on:
      bot:
        condition: service_healthy

  # Development-only ingress. No Cloudflare account or token is required.
  # The generated trycloudflare.com URL is printed in this container's logs.
  cloudflared-quick:
    image: cloudflare/cloudflared:2026.7.2
    restart: unless-stopped
    profiles: ["quick-tunnel"]
    command: tunnel --no-autoupdate --url http://bot:3000
    depends_on:
      bot:
        condition: service_healthy

volumes:
  postgres_data:
