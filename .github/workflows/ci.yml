name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate Docker Compose
        run: |
          cp .env.example .env
          docker compose config >/dev/null
          docker compose --profile quick-tunnel config >/dev/null
          docker compose --profile tunnel config >/dev/null
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
