name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ckuni_test
          POSTGRES_USER: ckuni
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ckuni -d ckuni_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://ckuni:test-password@127.0.0.1:5432/ckuni_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate Docker Compose
        run: |
          cp .env.example .env
          docker compose config >/dev/null
          docker compose --profile quick-tunnel config >/dev/null
          docker compose --profile tunnel config >/dev/null
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: npm run typecheck
      - run: npm run build

  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ckuni_test
          POSTGRES_USER: ckuni
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ckuni -d ckuni_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://ckuni:test-password@127.0.0.1:5432/ckuni_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run mutation

  container-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build and boot the deployment image with PostgreSQL
        run: |
          cp .env.example .env
          sed -i 's/^DISCORD_APPLICATION_ID=.*/DISCORD_APPLICATION_ID=smoke/' .env
          sed -i "s/^DISCORD_PUBLIC_KEY=.*/DISCORD_PUBLIC_KEY=$(printf '00%.0s' {1..32})/" .env
          sed -i 's/^DISCORD_BOT_TOKEN=.*/DISCORD_BOT_TOKEN=smoke/' .env
          sed -i 's/^DISCORD_GUILD_ID=.*/DISCORD_GUILD_ID=smoke/' .env
          trap 'docker compose down --volumes' EXIT
          docker compose up --detach --build postgres bot
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/health >/dev/null && \
               curl --fail --silent http://127.0.0.1:3000/ready >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs bot migrate postgres
          exit 1
